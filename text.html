<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const TEXTS = [
        "Hass", "Geld", "Gott", "Chef", "Plan", "Ziel", "Schlaf", "Traum",
        "Mitleid", "Friede", "Vertrauen", "Glück", "Licht", "System", "Morgen",
        "Heimat", "Leben", "Tod", "Angst", "Körper", "Seele", "Liebe", "Zeit",
        "Hoffnung", "Schmerz", "Sinn", "Vergangenheit", "Zukunft", "Rettung",
        "Grenze", "König", "Kampf", "Himmel", "Hölle", "Signal", "Ort", "Weg",
        "Atem", "Rausch", "Blick", "Klang", "Trauer", "Erinnerung", "Mensch",
        "Feuer", "Stille", "Wunder", "Ende",
      ].flatMap((word) => ["Kein", word]);

      const STRIPE = 15;
      const SPEED = 2;

      let mask, small;
      let field, fieldW, fieldH;
      let textIndex = 0;
      let paletteIndex = 2;
      let strengthPct = 0.08;
      let strength = 1;
      let phase = 0;
      let step = 5;
      let blurRadius = 4;

      function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        buildMask();
      }

      function buildMask() {
        strength = min(width, height) * strengthPct;

        mask?.remove();
        mask = createGraphics(width, height);
        mask.pixelDensity(1);
        mask.textAlign(CENTER, CENTER);
        mask.textStyle(BOLD);
        mask.fill(255);

        const txt = TEXTS[textIndex % TEXTS.length];
        let size = min(width, height) * 0.7;
        mask.textSize(size);
        while (mask.textWidth(txt) > width * 0.86) mask.textSize((size *= 0.96));
        mask.text(txt, width * 0.5, height * 0.5);

        buildField();
      }

      function buildField() {
        fieldW = max(256, floor(width * 0.35));
        fieldH = max(256, floor(height * 0.35));

        small?.remove();
        small = createGraphics(fieldW, fieldH);
        small.pixelDensity(1);
        small.image(mask, 0, 0, fieldW, fieldH);
        small.loadPixels();

        field = new Float32Array(fieldW * fieldH);
        for (let i = 0; i < field.length; i++)
          field[i] = small.pixels[i * 4 + 3] / 255;
        boxBlur(field, fieldW, fieldH, blurRadius, true);
        boxBlur(field, fieldW, fieldH, blurRadius, false);
      }

      function boxBlur(a, w, h, r, horizontal) {
        const [lines, len, lineStride, stride] = horizontal
          ? [h, w, w, 1]
          : [w, h, 1, w];
        const out = new Float32Array(a.length);
        for (let l = 0; l < lines; l++) {
          const base = l * lineStride;
          const at = (i) => a[base + Math.min(len - 1, Math.max(0, i)) * stride];
          let sum = 0;
          for (let i = -r; i <= r; i++) sum += at(i);
          for (let i = 0; i < len; i++) {
            out[base + i * stride] = sum / (r * 2 + 1);
            sum += at(i + r + 1) - at(i - r);
          }
        }
        a.set(out);
      }

      function sampleField(px, py) {
        const u = (px / width) * fieldW;
        const v = (py / height) * fieldH;
        const x0 = floor(u);
        const y0 = floor(v);
        const x1 = min(fieldW - 1, x0 + 1);
        const y1 = min(fieldH - 1, y0 + 1);
        const tx = u - x0;
        const ty = v - y0;
        return (
          field[y0 * fieldW + x0] * (1 - tx) * (1 - ty) +
          field[y0 * fieldW + x1] * tx * (1 - ty) +
          field[y1 * fieldW + x0] * (1 - tx) * ty +
          field[y1 * fieldW + x1] * tx * ty
        );
      }

      function draw() {
        phase += (deltaTime / 100) * SPEED;

        if (frameCount % 60 === 0) {
          textIndex = (textIndex + 1) % TEXTS.length;
          strengthPct = random(0.01, 0.1);
          blurRadius = int(random(4, 10));
          step = random(3, 10);
          buildMask();
        }

        const [c1, c2] = PALETTES[paletteIndex % PALETTES.length].map((c) =>
          color(c)
        );
        const wave = STRIPE * sin(phase * 0.1);

        background(0);
        for (let y = 0; y < height; y += step) {
          for (let x = 0; x < width; x += step) {
            const off = strength * (sampleField(x, y) - 0.5);
            const band = floor((y + off + wave) / STRIPE);
            fill((band & 1) === 0 ? c1 : c2);
            rect(x, y, step, step);
          }
        }
      }

      function keyPressed() {
        if (key === " ") {
          textIndex = (textIndex + 1) % TEXTS.length;
          buildMask();
        }
        if (key === "c") paletteIndex = (paletteIndex + 1) % PALETTES.length;
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        buildMask();
      }
    </script>
    <style>
      canvas {
        position: absolute;
        left: 0;
        top: 0;
        filter: blur(1px) contrast(50);
      }
    </style>
  </head>

  <body></body>
</html>
