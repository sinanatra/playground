<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const COLORS = ["#FADA15", "#f64949", "#CCB16A", "#B3AC9A", "#B2CAF8", "#9FD389"];
      const STEP = 4;

      let colorIndex = 0;
      let cols = 5;
      let linesPerCol = 30;
      let stripeW;
      let ribbons = [];

      function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        noFill();
        strokeCap(SQUARE);
        initRibbons();
      }

      function initRibbons(vNoise = 10) {
        stripeW = width / (cols * linesPerCol);
        ribbons = Array.from({ length: cols }, (_, i) => ({
          foldY: map(i, 0, cols - 1, height * 0.9, height * 0.1),
          radius: random(40, 360),
          wrap: random(2.0, 5.0),
          revealSpeed: random(120, 160),
          swayAmp: random(10, 100),
          swayFreq: 0.1,
          vNoise,
          start: millis() + i * 100,
          curl: random([1, -1]),
          highlight: int(random(linesPerCol)),
          shrink: random(0.6, 0.1),
        }));
      }

      function smoothstep(e0, e1, x) {
        const t = constrain((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function pathPoint(baseX, rb, ci, s) {
        if (s <= rb.foldY) return { x: baseX, y: s };
        const a = (s - rb.foldY) / rb.radius;
        const k = smoothstep(0, 0.6, a);
        const rr = max(4, rb.radius * (1 - rb.shrink * (a / TWO_PI)));
        const n =
          sin(a * rb.swayFreq * 0.5 + ci) * rb.vNoise * noise(a * 0.15, ci * 0.2) * k;
        return {
          x: baseX + rb.curl * k * (rr * (1 - cos(a)) + rb.swayAmp * sin(a * rb.swayFreq)),
          y: rb.foldY + rr * sin(a) - n * 0.1,
        };
      }

      function drawStripe(i, ci, progress) {
        const rb = ribbons[ci];
        const baseX = (i + 0.5) * stripeW;
        const end = constrain(progress, 0, rb.foldY + rb.radius * rb.wrap * TWO_PI);
        const local = i % linesPerCol;

        stroke(i % 2 ? 0 : local === rb.highlight ? COLORS[colorIndex] : 255);
        strokeWeight(stripeW);
        beginShape();
        for (let s = 0; s <= end; s += STEP) {
          const p = pathPoint(baseX, rb, ci, s);
          if (p.y <= height + 100) vertex(p.x, p.y);
        }
        endShape();
      }

      function draw() {
        background(0);

        if (frameCount % 1000 === 0) {
          cols = int(random(3, 20));
          linesPerCol = int(random(10, 30));
          colorIndex = (colorIndex + 1) % COLORS.length;
          initRibbons(random(10, 100));
        }

        const now = millis();
        for (let c = 0; c < cols; c++) {
          const progress = (max(0, now - ribbons[c].start) / 1000) * ribbons[c].revealSpeed;
          for (let i = c * linesPerCol; i < (c + 1) * linesPerCol; i++)
            drawStripe(i, c, progress);
        }
      }

      function keyPressed() {
        if (key === "c") {
          colorIndex = (colorIndex + 1) % COLORS.length;
          for (const rb of ribbons) rb.highlight = int(random(linesPerCol));
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        initRibbons();
      }
    </script>
  </head>

  <body></body>
</html>
