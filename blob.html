<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="lib/p5.vida.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/video-source.js"></script>
    <script>
      const COOLDOWN_MS = 500;
      const VIDEO_CHANGE_MS = 5 * 60 * 1000;
      const COLORS = [
        [255, 255, 0],
        [255, 0, 0],
        [0, 255, 0],
        [0, 0, 255],
        [255, 255, 255],
        [255, 128, 0],
        [0, 255, 255],
        [255, 0, 255],
        [128, 0, 255],
        [255, 182, 193],
        [240, 230, 140],
      ];

      let vid, vida, fft;
      let threshold = 0.004;
      let lastPeakTime = 0;
      let displayMode = 0;
      let blobColor = [255, 255, 255];
      let previousEnergy = 0;
      let alwaysOn = true;

      const videos = new VideoSource({
        defaults: Array.from({ length: 10 }, (_, i) => `media/video_${i + 1}.mp4`),
        size: () => [320, 240],
        onChange: (v) => (vid = v),
      });

      async function setup() {
        createCanvas(windowWidth, windowHeight);
        frameRate(30);
        background(0);
        fft = startMic().fft;
        bindRange("threshold", threshold, (v) => (threshold = v));

        await videos.load();

        vida = new Vida(this);
        vida.progressiveBackgroundFlag = true;
        vida.imageFilterFeedback = 0.85;
        vida.imageFilterThreshold = 0.1;
        vida.handleBlobsFlag = true;
        vida.trackBlobsFlag = true;
        vida.approximateBlobPolygonsFlag = false;
        vida.normMinBlobMass = 0.0001;

        setInterval(() => videos.next(), VIDEO_CHANGE_MS);
      }

      function draw() {
        if (!vid || !vida || vid.elt.readyState < 2) return;

        vida.update(vid);
        image(vid, 0, 0, width, height);

        noStroke();
        blendMode(MULTIPLY);
        fill(0, 95);
        rect(0, 0, width, height);
        blendMode(BLEND);

        const wave = fft.waveform();
        const energy = wave.reduce((sum, v) => sum + abs(v), 0) / wave.length;
        const changed = energy !== previousEnergy;
        previousEnergy = energy;

        if (((changed && energy > threshold) || alwaysOn) && millis() - lastPeakTime > COOLDOWN_MS) {
          displayMode = random([1, 2, 3, 4]);
          blobColor = random(COLORS);
          lastPeakTime = millis();
        }

        if (changed || alwaysOn) drawBlobs();
      }

      function drawBlobs() {
        const blobs = vida.getBlobs();
        const points = [];

        for (const b of blobs) {
          const x = b.normRectX * width;
          const y = b.normRectY * height;
          const w = b.normRectW * width;
          const h = b.normRectH * height;
          const cx = b.normMassCenterX * width;
          const cy = b.normMassCenterY * height;
          const label = `ID: ${b.id} X:${int(x)} Y:${int(y)}`;
          points.push({ x: cx, y: cy });

          if (displayMode === 0 || displayMode === 4) {
            textAlign(LEFT, BASELINE);
            stroke(...blobColor);
            fill(255, 255, 255, 30);
            rect(x, y, w, h);
            if (displayMode === 4) {
              line(x, y, x + w, y + h);
              line(x + w, y, x, y + h);
            }
            noStroke();
            fill(...blobColor);
            textSize(8);
            text(`ID: ${b.id}`, x, y - 10, w - 20);
          } else if (displayMode === 1) {
            textAlign(LEFT, BASELINE);
            noStroke();
            fill(...blobColor);
            textSize(6);
            text(label, x, y);
          } else {
            textAlign(CENTER, CENTER);
            noStroke();
            fill(...blobColor);
            ellipse(cx, cy, 5, 5);
            textSize(6);
            text(label, x, y + 12);
          }
        }

        if (displayMode === 2 && points.length <= 30) {
          stroke(...blobColor);
          noFill();
          for (let i = 0; i < points.length / 3; i++) {
            for (let j = i + 1; j < points.length; j++) {
              const p1 = points[i];
              const p2 = points[j];
              const mx = (p1.x + p2.x) / 2;
              const my = (p1.y + p2.y) / 2;
              bezier(
                p1.x, p1.y,
                mx + random(-250, 250), my + random(-250, 250),
                mx + random(-250, 250), my + random(-250, 250),
                p2.x, p2.y
              );
            }
          }
        }
      }

      function keyPressed() {
        if (key === "1") alwaysOn = !alwaysOn;
      }

      function mousePressed(e) {
        if (VideoSource.clickedCanvas(e)) videos.next();
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </head>

  <body>
    <header>
      <label for="threshold-slider"
        >Threshold: <span id="threshold-value"></span
      ></label>
      <input type="range" id="threshold-slider" min="0.001" max="0.1" step="0.001" />
      <span>Press 1 to toggle audio reactivity</span>
    </header>
  </body>
</html>
