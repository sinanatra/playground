<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const SHAFTS = 4;
      const BASE_RATE = 0.35;
      const NX = 0.023;
      const NY = 0.021;
      const PALETTE_HOLD_MS = 5000;

      let fft;
      let drift = 0;
      let seed = 0;
      let grid = 100;
      let band = 16;
      let draft = [];
      let seeds = [];
      let colScale = [];
      let rowScale = [];
      let colPos = [];
      let rowPos = [];
      let s1R = 0.22;
      let s2R = 0.12;
      let s3R = 0.08;
      let paletteIndex = 0;
      let lastPaletteSwitch = 0;

      function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        noStroke();
        fft = startMic(0.85, 512).fft;
        initDraft();
        initSeeds();
      }

      function initDraft() {
        band = random([16, 160, 1600]);
        grid = random([100, 150, 200]);

        const shift = random([1, 2, 3]);
        const tieUp = Array.from({ length: SHAFTS }, (_, r) =>
          Array.from({ length: SHAFTS }, (_, k) =>
            k === (r + shift) % SHAFTS || k === (r + shift + 1) % SHAFTS ? 1 : 0
          )
        );

        const blocks = random([6, 8, 10, 12]);
        const blockLen = floor(grid / blocks);
        const seq = [];
        for (let b = 0; b < blocks; b++)
          for (let i = 0; i < blockLen; i++)
            seq.push(b % 2 === 0 ? i : blockLen - 1 - i);
        while (seq.length < grid) seq.push(seq[seq.length % blockLen]);

        const threading = seq.slice(0, grid).map((v) => v % SHAFTS);
        const treadling = threading.map((s) => SHAFTS - 1 - s);
        draft = treadling.map((tr) => threading.map((th) => tieUp[tr][th]));
      }

      function initSeeds() {
        seeds = Array.from({ length: random([20, 30, 40, 50, 60]) }, () => ({
          x: random(grid),
          y: random(grid),
          vx: random(-0.03, 0.03),
          vy: random(-0.03, 0.03),
          phase: random(1000),
        }));
      }

      function updateWarp(t) {
        for (let i = 0; i < grid; i++) {
          const s1 = 1 + s1R * sin(t * 0.8 + i * 0.19 + drift * 0.6);
          const s2 = 1 + s1R * sin(t * 1.3 + i * 0.53 + seed * 0.9);
          const s3 = 1 + s2R * sin(t * 0.7 + i * 0.31);
          colScale[i] = max(0.15, s1 * s2 * s3 - 0.2);
        }
        for (let j = 0; j < grid; j++) {
          const s1 = 1 + s1R * sin(t * 0.9 + j * 0.23 + drift * 0.5);
          const s2 = 1 + s2R * sin(t * 1.1 + j * 0.41 + seed * 0.7);
          const s3 = 1 + s3R * sin(t * 0.6 + j * 0.29);
          rowScale[j] = max(0.15, s1 * s2 * s3 - 0.2);
        }
        colScale.length = rowScale.length = grid;
        cumulate(colScale, colPos, width);
        cumulate(rowScale, rowPos, height);
      }

      function cumulate(scales, positions, total) {
        const k = total / scales.reduce((a, b) => a + b, 0);
        positions[0] = 0;
        for (let i = 0; i < scales.length; i++)
          positions[i + 1] = positions[i] + scales[i] * k;
      }

      function updateSeeds(t) {
        for (const s of seeds) {
          s.x = (s.x + s.vx + 0.03 * sin(t * 0.5 + s.phase) + grid) % grid;
          s.y = (s.y + s.vy + 0.03 * cos(t * 0.6 + s.phase * 1.3) + grid) % grid;
        }
      }

      function draw() {
        background(0);

        fft.analyze();
        const bass = fft.getEnergy("bass") / 255;
        const mid = fft.getEnergy("mid") / 255;
        const treble = fft.getEnergy("treble") / 255;
        drift += 0.004 + 0.016 * treble;
        seed += 0.001 + 0.004 * mid;

        const t = millis() * 0.001;
        updateWarp(t);
        updateSeeds(t);

        const rate =
          BASE_RATE * (0.7 + 1.8 * (0.25 * bass + 0.45 * mid + 0.3 * treble));
        const radius = (t * rate * grid) % (grid * 2);
        const diagPhase = t * 1.2;
        const [on, off] = PALETTES[paletteIndex % PALETTES.length].map((c) =>
          color(c)
        );

        for (let y = 0; y < grid; y++) {
          for (let x = 0; x < grid; x++) {
            let dmin = Infinity;
            for (const s of seeds)
              dmin = min(dmin, abs(x - s.x) + abs(y - s.y));

            const rings = floor((radius - dmin) / band) & 1;
            const wave =
              sin(x * 0.19 + y * 0.17 + diagPhase) +
              sin(x * 0.07 + diagPhase * 0.7) +
              sin(y * 0.09 + diagPhase * 0.9);
            const n = noise(x * NX + t * 0.35, y * NY + t * 0.33);
            const v =
              draft[y][x] ^ ((x + y) & 1) ^ rings ^ (wave > 0) ^ (n > 0.5);

            fill(v ? on : off);
            rect(
              colPos[x],
              rowPos[y],
              colPos[x + 1] - colPos[x] + 1,
              rowPos[y + 1] - rowPos[y] + 1
            );
          }
        }

        if (millis() - lastPaletteSwitch > PALETTE_HOLD_MS) nextPalette();
        if (frameCount % 40 === 0) {
          initDraft();
          initSeeds();
          s1R = random([0.22, 0.55, 0.8]);
          s2R = random([0.22, 0.55, 0.8]);
          s3R = random([0.22, 0.55, 0.8]);
        }
      }

      function nextPalette() {
        paletteIndex++;
        lastPaletteSwitch = millis();
      }

      function keyPressed() {
        if (key === " ") initSeeds();
        if (key === "c") nextPalette();
      }

      function mousePressed() {
        initSeeds();
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </head>

  <body></body>
</html>
