<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const GLYPHS = [
        ..."01▌▐░▒▓█▄▀┘┐┌└│─┼╳•×+−=≡◊◌○●◼◻◾◽⬛⬜⬤⟁⧫⨯◬◮◯◹◾◱◰⧖⧗⧙⧚",
      ];

      let fft;
      let cols = 100;
      let rows = 50;
      let cellW, cellH;
      let colAmp = [];
      let seed = 0;

      function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        noStroke();
        textAlign(CENTER, CENTER);
        textFont("monospace");
        fft = startMic(0.8, 512).fft;
        computeCell();
      }

      function computeCell() {
        cellW = width / cols;
        cellH = height / rows;
        textSize(cellH * 0.9);
      }

      function draw() {
        background(0);

        const spec = fft.analyze();
        for (let c = 0; c < cols; c++) {
          const a0 = floor(map(c, 0, cols, 0, spec.length * 0.9));
          const a1 = min(a0 + floor(spec.length / cols) + 1, spec.length - 1);
          let sum = 0;
          for (let i = a0; i <= a1; i++) sum += spec[i];
          colAmp[c] = sum / (a1 - a0 + 1) / 255;
        }

        const invert = frameCount % 120 < 2;
        const t = millis() * 0.001;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const n = fract(
              sin((x + 1.618) * (y + 2.414) + t * 7.0 + seed * 0.221) *
                43758.5453
            );
            const p = constrain(
              colAmp[x] * 1.5 + (y / rows) * 0.15 + (n - 0.5) * 0.3,
              0,
              1
            );
            fill(invert ? 255 - p * 255 : p * 255);
            text(
              GLYPHS[floor(p * (GLYPHS.length - 1))],
              x * cellW + cellW * 0.5,
              y * cellH + cellH * 0.5
            );
          }
        }
        seed += 0.002;

        if (frameCount % 180 === 0) {
          cols = random([48, 60, 72, 84, 96]);
          rows = random([36, 42, 48, 60]);
          computeCell();
        }

        if (frameCount % 9 === 0) {
          push();
          blendMode(ADD);
          fill(255, random(5, 20));
          rect(0, random(height), width, 1);
          pop();
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        computeCell();
      }
    </script>
  </head>

  <body></body>
</html>
