<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const BASS_THRESHOLD = 30;

      let fft;
      let columnCount = 2;
      let rowCount = 50;
      let speeds = [];
      let variableWidth = false;

      function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        frameRate(30);
        rectMode(CENTER);
        fft = startMic().fft;
        updateSpeeds();
      }

      function draw() {
        background(0);

        if (frameCount % 120 === 0) {
          columnCount = random([2, 3, 4, 5, 10]);
          rowCount = variableWidth ? random([50, 100, 200, 300]) : 50;
          updateSpeeds();
          variableWidth = !variableWidth;
        }

        fft.analyze();
        const bass = fft.getEnergy("bass");
        const activity =
          bass > BASS_THRESHOLD ? map(bass, BASS_THRESHOLD, 255, 0, 1) : 0;

        const colW = width / columnCount;
        const rowH = height / rowCount;

        for (let x = 0; x < columnCount; x++) {
          for (let y = 0; y < rowCount; y++) {
            const px = x * colW + colW / 2;
            const py = y * rowH + rowH / 2;
            const v = hash(x, y, frameCount * speeds[x]);
            const w = variableWidth
              ? map(v * activity, 0.1, 1, colW / 10, colW)
              : colW;

            stroke(50);
            noFill();
            rect(px, py, colW, rowH);

            noStroke();
            fill(v * 255);
            rect(px, py, w, rowH);
          }
        }
      }

      function updateSpeeds() {
        speeds = Array.from({ length: columnCount }, () =>
          random(0.0000005, 0.000002)
        );
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </head>

  <body></body>
</html>
