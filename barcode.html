<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const SNARE_THRESHOLD = 120;
      const COOLDOWN_MS = 500;

      let fft;
      let gridX = 200;
      let gridY = 2;
      let speeds = [];
      let edges = [];
      let kickThreshold = 150;
      let lastHit = 0;

      function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        frameRate(20);
        stroke(0);
        fft = startMic().fft;
        shuffleRows();
        bindRange("threshold", kickThreshold, (v) => (kickThreshold = v));
      }

      function draw() {
        background(0);

        fft.analyze();
        const kick = fft.getEnergy(20, 100);
        const snare = fft.getEnergy(250, 2000);
        const hit = kick > kickThreshold || snare > SNARE_THRESHOLD;
        if (hit && millis() - lastHit > COOLDOWN_MS) {
          gridY = random([2, 3, 4, 5, 10]);
          gridX = random([200, 300, 400, 500, 650, 700]);
          shuffleRows();
          lastHit = millis();
        }

        const tileW = width / gridX;
        const tileH = height / gridY;
        const shift = millis() * 0.001 * max(gridX, gridY);

        for (let y = 0; y < gridY; y++) {
          const offset = shift * speeds[y] * 0.05;
          for (let x = 0; x < gridX; x++) {
            const on = hash(floor(x - offset), y) >= edges[y];
            fill(on ? 255 : 0);
            rect(x * tileW, y * tileH, tileW, on ? tileH : tileH * 0.1);
          }
        }
      }

      function shuffleRows() {
        speeds = Array.from({ length: gridY }, () => random(-2, 2));
        edges = Array.from({ length: gridY }, () => random(0.1, 0.9));
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </head>

  <body>
    <header>
      <label for="threshold-slider"
        >Kick threshold: <span id="threshold-value"></span
      ></label>
      <input type="range" id="threshold-slider" min="0" max="255" step="1" />
    </header>
  </body>
</html>
