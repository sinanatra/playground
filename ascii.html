<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const GRADIENTS = [
        "   ▍▎▏▚▀▓▉▊▋▌▍▎▏■□▪▫/*+=-:·▉▊▋▌▍▎▏|+=-:·",
        "   █▓▒░░▒▓█▉▊▋▌▍▎▏■□▪░▒▓.:-=+*#@",
        "   ▚▀▓▒░#@■□▪▫/*+=-~^:,._▚▀▓▒░#@■□▪▫:·",
        "   ▪▫@&%$O0o+=~-^:,._`'·▉▊▋▌▍▎▏░▒▓.:-+",
        "   ▉▊▋▌▍▎▚▀▓▒▉▊▋▌▍▎■□▪░▒▓█▍▎▏:·",
        "   ▒░▓█◆◇⬤◯○▋▍▎▏░▒▓▉▌░▒▓█",
        "   ✶✴❄✿❀☼♡♥♢♦☯☮▎▏▚▀▓▒▍▎▏@▪▫+=",
        "   ⍚⍀⎔⎕⎙⌇⌑⌖⊙⊚⊛⎈☰⟐▚▀▓▒░░▒▋▌▍▍▎▏",
        "   ☰☷☲☱☵☶⚘⚙⚗⚒◐◑◒◓⬤○∞⋆∘⊖§¶▍▎▏▚▀▒",
        "   ⇧⇩⇨⇦↻↺↹➤➔➙➫▲▼◀▶⠁⠂⠄⠇⠈⠐⠠",
      ];
      const NOISE_SCALE = 0.1;
      const SPEED = 0.01;

      let gradient = "█▍▎▏▚▀▓▉▊▋▌▍▎▏■□▪▫#@&%$O0o+=~-^:,._`'·";
      let t = 0;
      let wave = 100;
      let baseHue = 0;
      let grid = 15;

      function setup() {
        colorMode(HSB, 255);
        createCanvas(windowWidth, windowHeight);
        textFont("Courier");
        textAlign(CENTER, CENTER);
        noStroke();
        bindRange("grid", grid, (v) => (grid = v));
      }

      function draw() {
        background(0);
        if (frameCount % 100 === 0) gradient = random(GRADIENTS);
        if (frameCount % 150 === 0) wave = random([0.1, 100, 150, 300, 400, 500]);
        t += SPEED;
        baseHue = (baseHue + 1) % 255;

        const cols = floor(width / grid);
        const rows = floor(height / grid);
        const size = width / cols;
        const offset = t * 0.9;
        textSize(size);

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const n = noise(
              (x + offset) * NOISE_SCALE,
              (y + offset) * NOISE_SCALE,
              t
            );
            const char = gradient[floor(map(n, 0, 1, 0, gradient.length - 1))];
            const px = x * size + size / 2 + sin(t + y * 0.1) * wave;
            const py = y * size + size / 2 + cos(t + x * 0.1) * wave;

            fill((baseHue + n * 100) % 255, 200, map(n, 0, 1, 150, 255));
            push();
            translate(px, py);
            rotate(n * TWO_PI * 0.1);
            text(char, 0, 0);
            pop();
          }
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </head>

  <body>
    <header>
      <label for="grid-slider">Grid: <span id="grid-value"></span></label>
      <input type="range" id="grid-slider" min="10" max="50" step="1" />
    </header>
  </body>
</html>
