<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/video-source.js"></script>
    <script>
      const CLEAR_MS = 250 * 1000;
      const DIFF_THRESHOLD = 80;

      let fft, vid;
      let graphics;
      let prevFrame;
      let lastClear = 0;

      const videos = new VideoSource({
        defaults: Array.from({ length: 10 }, (_, i) => `media/video_${i + 1}.mp4`),
        size: () => [windowWidth, windowHeight],
        onChange: (v) => (vid = v),
      });

      async function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        graphics = createGraphics(windowWidth, windowHeight);
        fft = startMic().fft;
        await videos.load();
        background(0);
      }

      function draw() {
        if (!vid || !vid.elt.readyState || vid.elt.paused) return;

        fft.analyze();
        const bpm = map(fft.getEnergy("bass"), 0, 255, 60, 180);
        vid.speed(map(bpm, 60, 180, 0.1, 2));

        if (millis() - lastClear > CLEAR_MS) {
          background(0);
          lastClear = millis();
        }

        if (frameCount % 2 !== 0) return;

        const frame = vid.get(0, 0, width, height);
        frame.filter(BLUR);
        frame.loadPixels();

        if (prevFrame) drawMotion(frame);
        prevFrame = frame;
      }

      function drawMotion(frame) {
        const cur = frame.pixels;
        const prev = prevFrame.pixels;
        const n = graphics.width * graphics.height;
        if (cur.length < n * 4 || prev.length < n * 4) return;

        const diffs = new Uint16Array(n);
        let total = 0;
        for (let i = 0; i < n; i++) {
          const p = i * 4;
          diffs[i] =
            abs(cur[p] - prev[p]) +
            abs(cur[p + 1] - prev[p + 1]) +
            abs(cur[p + 2] - prev[p + 2]);
          total += diffs[i];
        }

        if (total / n > DIFF_THRESHOLD) {
          background(0, 0.5);
          return;
        }

        graphics.clear();
        graphics.image(frame, 0, 0);
        graphics.loadPixels();
        for (let i = 0; i < n; i++)
          graphics.pixels[i * 4 + 3] = diffs[i] > DIFF_THRESHOLD ? 255 : 0;
        graphics.updatePixels();
        image(graphics, 0, 0);
      }

      function mousePressed(e) {
        if (VideoSource.clickedCanvas(e)) videos.next();
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        graphics.remove();
        graphics = createGraphics(windowWidth, windowHeight);
        prevFrame = null;
        if (vid) vid.size(windowWidth, windowHeight);
      }
    </script>
  </head>

  <body></body>
</html>
