<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="js/common.js"></script>
    <script>
      const PALETTE_HOLD_MS = 5000;

      let fft;
      let drift = 0;
      let driftV = 0.004;
      let seed = 0;
      let grid = 200;
      let variance = 1000;
      let useColor = false;
      let paletteIndex = 0;
      let lastPaletteSwitch = 0;

      function setup() {
        pixelDensity(1);
        createCanvas(windowWidth, windowHeight);
        rectMode(CENTER);
        noStroke();
        fft = startMic(0.85, 512).fft;
      }

      function draw() {
        background(0);

        fft.analyze();
        const bass = fft.getEnergy("bass") / 255;
        const mid = fft.getEnergy("mid") / 255;
        const treble = fft.getEnergy("treble") / 255;

        drift += driftV + 0.016 * treble;
        seed += 0.001 + 0.004 * mid;

        if (frameCount % 40 === 0) grid = random(100, 300);
        if (frameCount % 60 === 0) variance = random(100, 3000);
        if (frameCount % 12 === 0) driftV = random(0.1, 1.0);

        const [dark, light] = useColor
          ? PALETTES[paletteIndex % PALETTES.length].map((c) => color(c))
          : [color(0), color(255)];
        const cw = width / grid;
        const ch = height / grid;
        const t = millis() * 0.0012;

        for (let j = 0; j < grid; j++) {
          for (let i = 0; i < grid; i++) {
            const nx = (i + 0.5) / grid - 0.5;
            const ny = (j + 0.5) / grid - 0.5;
            const r = sqrt(nx * nx + ny * ny);
            const th = atan2(ny, nx);
            const w =
              sin(r * variance + drift * driftV + t * 2.0) +
              sin(th * variance + t * 1.4) +
              sin((nx + ny) * 36.0 + seed * 8.0);
            const v = constrain(0.5 + 0.5 * w, 0, 1);
            const k = ((i + j) & 1) === 0 ? v : 1.0 - v;

            fill(k < 0.5 ? dark : light);
            rect(i * cw + cw * 0.5, j * ch + ch * 0.5, cw + 1, ch + 1);
          }
        }

        push();
        blendMode(ADD);
        fill(255, 16 + 24 * bass);
        for (const y of [0.25, 0.5, 0.75])
          rect(width * 0.5, height * y, width, 1);
        pop();

        if (millis() - lastPaletteSwitch > PALETTE_HOLD_MS) nextPalette();
      }

      function nextPalette() {
        paletteIndex++;
        lastPaletteSwitch = millis();
      }

      function keyPressed() {
        if (key === "c") nextPalette();
        if (key === "b") useColor = !useColor;
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </head>

  <body></body>
</html>
