<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <script src="p5.min.js"></script>
    <script src="p5.sound.min.js"></script>
    <script>
      let mic, fft, vid;
      // accepts archive.org/details/ID pages, bare IDs, or direct video urls
      // (local files like "media/video_2.mp4" work too)
      const defaultVideoUrls = [
        "https://archive.org/details/0792_Horsepower_M00251_03_31_16_00",
      ];
      const STORAGE_KEY = "datamosh-urls";
      let videoUrls = shuffleArray(loadSavedUrls() || [...defaultVideoUrls]);
      let currentVideoIndex = 0;
      let resolvedUrls = new Map();
      let loadToken = 0;
      let failedLoads = 0;
      let switchInterval = 180000;
      let lastSwitchTime = 0;
      let lastPeakTime = 0;
      let threshold = 50;
      let encoder, decoder;
      let isWebCodecsReady = false;
      let ctx;
      let videoCanvas, videoCtx;
      let datamoshRepeats = 7;
      let isVideoSwitching = false;
      let isFrameReady = false;
      let audioReactive = false;

      let texts = [
        "我用自己的血写下真理",
        "哪怕纸张拒绝，我的心仍要呐喊",
        "自由属于敢于说出的人",
        "铁窗不能封住风",
        "信念不会死去，它在每一滴血里重生",
        "真理的力量",
        "决不在于",
        "维护真理者",
        "姿态的傲慢",

        // "The power of truth",
        // "never lies in",
        // "the arrogant air",
        // "of the guardians of truth",

        // "As you prepare your breakfast, think of others",
        // "As you conduct your wars, think of others",
        // "As you pay your water bill, think of others",
        // "As you return home, to your home, think of others",
        // "As you sleep and count the stars, think of others",
        // "As you liberate yourself in metaphor, think of others",
        // "As you think of others far away, think of yourself",

        "وأنتَ تعدّ فطورك، فكّر بغيرك",
        "وأنتَ تخوض حروبك، فكّر بغيرك",
        "وأنتَ تسدّد فاتورة الماء، فكّر بغيرك",
        "وأنتَ تعود إلى البيت، بيتك، فكّر بغيرك",
        "وأنت تنام وتحصي الكواكب، فكّر بغيرك",
        "وأنت تحرّر نفسك بالاستعارات، فكّر بغيرك",
        "وأنت تفكّر بالآخرين البعيدين، فكّر بنفسك",
      ];

      let showText = false;
      let textValue = "";
      let textStart = 0;
      let textDuration = 0;
      let nextTextAt = 0;
      let textWrapWidth = 0;
      let textFontSize = 64;

      async function setup() {
        colorMode(HSL, 360, 100, 100);
        createCanvas(windowWidth, windowHeight);
        ctx = canvas.getContext("2d");
        frameRate(30);
        textFont("Helvetica, sans-serif");
        textAlign(CENTER, CENTER);
        nextTextAt = millis() + random(1000, 4000);
        await loadVideo();
      }

      function mousePressed(e) {
        if (e && e.target !== canvas) return;
        switchVideo();
        if (audioReactive && (!mic || !fft)) enableAudioReactive();
      }

      function switchVideo() {
        currentVideoIndex = (currentVideoIndex + 1) % videoUrls.length;
        loadVideo();
        lastSwitchTime = millis();
      }

      async function enableAudioReactive() {
        await userStartAudio();
        mic = new p5.AudioIn();
        await mic.start();
        fft = new p5.FFT(0.6, 256);
        fft.setInput(mic);
      }

      function disableAudioReactive() {
        if (mic && mic.enabled) mic.stop();
        mic = null;
        fft = null;
      }

      function archiveId(entry) {
        const m = entry.match(/archive\.org\/(?:details|embed)\/([^/?#]+)/);
        if (m) return decodeURIComponent(m[1]);
        if (/^[\w.-]+$/.test(entry) && !/\.(mp4|webm|ogv|mov|m4v)$/i.test(entry))
          return entry;
        return null;
      }

      // archive.org files lack CORS headers: route them through the vite proxy
      function proxied(url) {
        const m = url.match(
          /^https?:\/\/(?:[\w-]+\.)*archive\.org\/(?:download\/|\d+\/items\/)(.+)$/
        );
        return m ? `/ia/download/${m[1]}` : url;
      }

      async function resolveVideoUrl(entry) {
        const id = archiveId(entry);
        if (!id) return proxied(entry);
        if (resolvedUrls.has(id)) return resolvedUrls.get(id);
        const res = await fetch(`https://archive.org/metadata/${id}`);
        const meta = await res.json();
        const files = (meta.files || []).map((f) => f.name);
        const videos = files.filter((n) => /\.(mp4|webm|ogv|m4v)$/i.test(n));
        const pick =
          videos.find((n) => /_512kb\.mp4$/i.test(n)) ||
          videos.find((n) => /\.mp4$/i.test(n)) ||
          videos[0];
        if (!pick) throw new Error(`no video in ${id}`);
        const url = `/ia/download/${id}/${pick
          .split("/")
          .map(encodeURIComponent)
          .join("/")}`;
        resolvedUrls.set(id, url);
        return url;
      }

      function skipBrokenVideo(token) {
        if (token !== loadToken) return;
        isVideoSwitching = false;
        failedLoads++;
        if (failedLoads < videoUrls.length) switchVideo();
      }

      async function loadVideo() {
        if (vid) {
          // detach handlers first: removing the element can fire stale events
          vid.elt.onloadedmetadata = vid.elt.onloadeddata = vid.elt.onerror =
            null;
          vid.remove();
        }
        vid = null;
        isVideoSwitching = true;
        isFrameReady = false;
        if (!videoUrls.length) return;
        const token = ++loadToken;
        let src;
        try {
          src = await resolveVideoUrl(videoUrls[currentVideoIndex]);
        } catch (e) {
          console.warn(e);
          return skipBrokenVideo(token);
        }
        if (token !== loadToken) return;
        // crossOrigin must be set before src, otherwise VideoFrame is tainted
        const el = document.createElement("video");
        el.crossOrigin = "anonymous";
        el.playsInline = true;
        el.src = src;
        document.body.appendChild(el);
        const v = new p5.MediaElement(el, _renderer._pInst);
        vid = v;
        v.size(windowWidth, windowHeight);
        v.volume(0);
        v.loop();
        v.hide();
        el.onloadedmetadata = () => {
          if (token !== loadToken) return;
          if (isFinite(el.duration)) el.currentTime = random(0, el.duration);
        };
        el.onloadeddata = async () => {
          if (token !== loadToken) return;
          failedLoads = 0;
          const isSupported = await checkCodecSupport();
          if (token !== loadToken) return;
          if (isSupported) {
            setupWebCodecs();
            el.play()
              .then(() => {
                if (token !== loadToken) return;
                isWebCodecsReady = true;
                isVideoSwitching = false;
                isFrameReady = true;
              })
              .catch(() => {});
          } else {
            isVideoSwitching = false;
          }
        };
        el.onerror = () => {
          console.warn("video failed to load:", src);
          skipBrokenVideo(token);
        };
      }

      function loadSavedUrls() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(saved) && saved.length ? saved : null;
        } catch (e) {
          return null;
        }
      }

      function setVideoUrls(urls, { save = true } = {}) {
        videoUrls = shuffleArray(urls.slice());
        try {
          if (save) localStorage.setItem(STORAGE_KEY, JSON.stringify(urls));
          else localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        currentVideoIndex = 0;
        failedLoads = 0;
        loadVideo();
        lastSwitchTime = millis();
      }

      function addVideoUrl(url) {
        const urls = currentUrlList();
        urls.push(url);
        setVideoUrlsUI(urls);
        videoUrls.splice(currentVideoIndex + 1, 0, url);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(urls));
        } catch (e) {}
        switchVideo();
      }

      function currentUrlList() {
        return document
          .getElementById("url-list")
          .value.split("\n")
          .map((s) => s.trim())
          .filter(Boolean);
      }

      function setVideoUrlsUI(urls) {
        document.getElementById("url-list").value = urls.join("\n");
      }

      function draw() {
        if (!vid || !isWebCodecsReady || isVideoSwitching || !isFrameReady)
          return;

        if (audioReactive && fft) {
          let spectrum = fft.analyze();
          let peak = Math.max(...spectrum);
          let peakIndex = spectrum.indexOf(peak);
          let bassEnergy = fft.getEnergy("bass");
          let bpm = constrain(map(bassEnergy, 0, 255, 60, 180), 60, 180);
          let speed = constrain(map(bpm, 60, 180, 0.1, 5), 1, 3);
          let offset = 2000;
          // vid.speed(1);
          if (peak > threshold && millis() - lastPeakTime > offset) {
            let direction = int(map(peakIndex, 0, 255, 1, 2));
            if (peakIndex == 0) datamoshRepeats = 3;
            if (peakIndex > 0 && peakIndex <= 2)
              datamoshRepeats = int(random(2, 3));
            if (peakIndex > 2 && peakIndex < 5) {
              datamoshRepeats = int(random(2, 4));
              direction = -direction;
            }
            if (peakIndex >= 10) datamoshRepeats = int(random(2, 6));
            else datamoshRepeats = 2;
            lastPeakTime = millis();
          }
        } else {
          if (millis() - lastPeakTime > random(3000, 8000)) {
            datamoshRepeats = int(random(3, 10));
            if (random() < 0.3) datamoshRepeats = 2;
            lastPeakTime = millis();
          }
          // vid.speed(1);
        }

        if (millis() > nextTextAt && !showText) {
          textValue = texts[int(random(texts.length))];
          textDuration = random(1200, 4000);
          textStart = millis();
          showText = true;
        }

        if (videoCanvas) {
          ctx.globalAlpha = 1;
          ctx.drawImage(videoCanvas, 0, 0, windowWidth, windowHeight);
        }

        if (showText) {
          fill("red");
          textSize(textFontSize);
          text(textValue, width / 2, height / 2);
          if (millis() - textStart >= textDuration) {
            showText = false;
            nextTextAt = millis() + random(6000, 16000);
          }
        }

        // if (frameCount % 120 === 0) datamoshRepeats = 1;

        if (
          vid.elt.readyState === 4 &&
          !vid.elt.paused &&
          encoder &&
          encoder.state === "configured"
        ) {
          try {
            const frame = new VideoFrame(vid.elt);
            encoder.encode(frame, { keyFrame: false });
            frame.close();
          } catch (e) {}
        }
      }

      async function checkCodecSupport() {
        const config = {
          type: "file",
          video: {
            contentType: 'video/webm; codecs="vp8"',
            width: windowWidth,
            height: windowHeight,
            bitrate: 500000,
            framerate: 30,
          },
        };
        const mediaCapabilities =
          await navigator.mediaCapabilities.decodingInfo(config);
        return mediaCapabilities.supported;
      }

      function setupWebCodecs() {
        videoCanvas = document.createElement("canvas");
        videoCanvas.width = windowWidth;
        videoCanvas.height = windowHeight;
        videoCtx = videoCanvas.getContext("2d");
        encoder = new VideoEncoder({
          output: handleEncodedChunk,
          error: () => {},
        });
        encoder.configure({
          codec: "vp8",
          width: windowWidth,
          height: windowHeight,
        });
        decoder = new VideoDecoder({
          output: (f) => handleDecodedFrame(f),
          error: () => {},
        });
        decoder.configure({ codec: "vp8" });
      }

      function handleEncodedChunk(chunk) {
        if (decoder && decoder.state === "configured") {
          for (let i = 0; i < datamoshRepeats; i++) decoder.decode(chunk);
        }
      }

      function handleDecodedFrame(frame) {
        if (!videoCtx) {
          frame.close();
          return;
        }
        videoCtx.globalAlpha = 1;
        videoCtx.setTransform(1, 0, 0, 1, 0, 0);
        videoCtx.clearRect(0, 0, windowWidth, windowHeight);
        videoCtx.save();
        videoCtx.translate(windowWidth, 0);
        videoCtx.scale(-1, 1);
        videoCtx.drawImage(frame, 0, 0, windowWidth, windowHeight);
        videoCtx.restore();
        frame.close();
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        if (vid) vid.size(windowWidth, windowHeight);
        if (videoCanvas) {
          videoCanvas.width = windowWidth;
          videoCanvas.height = windowHeight;
        }
        if (showText) computeTextLayout(textValue);
      }

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("threshold-slider")
          .addEventListener("input", (e) => {
            threshold = parseInt(e.target.value, 10);
            document.getElementById("threshold-value").textContent = threshold;
          });
        const toggle = document.getElementById("audio-toggle");
        const label = document.getElementById("audio-label");
        toggle.checked = false;
        label.textContent = "Audio reactive: off";
        toggle.addEventListener("change", async (e) => {
          audioReactive = e.target.checked;
          label.textContent = audioReactive
            ? "Audio reactive: on"
            : "Audio reactive: off";
          if (audioReactive) await enableAudioReactive();
          else disableAudioReactive();
        });

        setVideoUrlsUI(loadSavedUrls() || defaultVideoUrls);
        const urlInput = document.getElementById("url-input");
        const addUrl = () => {
          const url = urlInput.value.trim();
          if (!url) return;
          urlInput.value = "";
          addVideoUrl(url);
        };
        document.getElementById("url-add").addEventListener("click", addUrl);
        urlInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") addUrl();
        });
        document.getElementById("url-apply").addEventListener("click", () => {
          setVideoUrls(currentUrlList());
        });
        document.getElementById("url-reset").addEventListener("click", () => {
          setVideoUrlsUI(defaultVideoUrls);
          setVideoUrls(defaultVideoUrls, { save: false });
        });
        document
          .getElementById("url-next")
          .addEventListener("click", () => switchVideo());
        document
          .getElementById("url-toggle")
          .addEventListener("click", () =>
            document.getElementById("url-panel").classList.toggle("open")
          );
      });
    </script>
  </head>

  <header>
    <span id="controls">
      <label id="audio-label" for="audio-toggle" style="color: white"></label>
      <input type="checkbox" id="audio-toggle" />
      <label for="threshold-slider" style="color: white"
        >Threshold: <span id="threshold-value">50</span></label
      >
      <input
        type="range"
        id="threshold-slider"
        min="10"
        max="2000"
        step="1"
        value="150"
      />
    </span>
    <span id="url-controls">
      <input
        type="text"
        id="url-input"
        placeholder="archive.org/details/… or .mp4 url"
      />
      <button id="url-add">Play</button>
      <button id="url-next">Next</button>
      <button id="url-toggle">Playlist</button>
    </span>
    <div id="url-panel">
      <textarea id="url-list" spellcheck="false"></textarea>
      <div>
        <button id="url-apply">Apply</button>
        <button id="url-reset">Reset defaults</button>
      </div>
    </div>
  </header>

  <body></body>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    header {
      background: black;
      color: white;
      padding: 10px 0;
      position: absolute;
      width: 100%;
      opacity: 0;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10;
      flex-wrap: wrap;
    }
    header:hover,
    header:focus-within {
      opacity: 1;
    }
    #url-controls {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    #url-input {
      width: 320px;
    }
    #url-panel {
      display: none;
      width: 100%;
      padding: 0 10px;
      box-sizing: border-box;
    }
    #url-panel.open {
      display: block;
    }
    #url-list {
      width: 100%;
      height: 200px;
      box-sizing: border-box;
      background: #111;
      color: white;
      border: 1px solid #444;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 6px;
    }
    video {
      display: none;
    }
    header a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
    }
    #controls {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      padding-left: 10px;
    }
    canvas {
      display: block;
    }
  </style>
</html>
