<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>`.-':_,^=;+!r</title>
    <link rel="stylesheet" href="css/common.css" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/video-source.js"></script>
    <script>
      const TEXTS = [
        "我用自己的血写下真理",
        "哪怕纸张拒绝，我的心仍要呐喊",
        "自由属于敢于说出的人",
        "铁窗不能封住风",
        "信念不会死去，它在每一滴血里重生",
        "真理的力量",
        "决不在于",
        "维护真理者",
        "姿态的傲慢",
        "وأنتَ تعدّ فطورك، فكّر بغيرك",
        "وأنتَ تخوض حروبك، فكّر بغيرك",
        "وأنتَ تسدّد فاتورة الماء، فكّر بغيرك",
        "وأنتَ تعود إلى البيت، بيتك، فكّر بغيرك",
        "وأنت تنام وتحصي الكواكب، فكّر بغيرك",
        "وأنت تحرّر نفسك بالاستعارات، فكّر بغيرك",
        "وأنت تفكّر بالآخرين البعيدين، فكّر بنفسك",
      ];
      const TEXT_SIZE = 64;
      const PEAK_COOLDOWN_MS = 2000;

      let mic, fft, vid;
      let ctx;
      let videoCanvas, videoCtx;
      let encoder, decoder;
      let ready = false;
      let audioReactive = false;
      let threshold = 50;
      let lastPeakTime = 0;
      let datamoshRepeats = 7;

      let textValue = "";
      let textUntil = 0;
      let nextTextAt = 0;

      const videos = new VideoSource({
        defaults: [
          "https://archive.org/details/0792_Horsepower_M00251_03_31_16_00",
        ],
        storageKey: "datamosh-urls",
        size: () => [windowWidth, windowHeight],
        onChange: (v) => {
          vid = v;
          ready = false;
        },
        onReady: onVideoReady,
      });

      async function setup() {
        createCanvas(windowWidth, windowHeight);
        ctx = canvas.getContext("2d");
        frameRate(30);
        textFont("Helvetica, sans-serif");
        textAlign(CENTER, CENTER);
        nextTextAt = millis() + random(1000, 4000);
        bindRange("threshold", threshold, (v) => (threshold = v));
        bindAudioToggle();
        await videos.load();
      }

      async function onVideoReady(v) {
        const supported = await checkCodecSupport();
        if (!videos.isCurrent(v) || !supported) return;
        setupWebCodecs();
        v.elt
          .play()
          .then(() => {
            if (videos.isCurrent(v)) ready = true;
          })
          .catch(() => {});
      }

      function draw() {
        if (!vid || !ready) return;

        updateRepeats();

        if (videoCanvas) ctx.drawImage(videoCanvas, 0, 0, windowWidth, windowHeight);
        drawText();

        if (vid.elt.readyState === 4 && !vid.elt.paused && encoder.state === "configured") {
          try {
            const frame = new VideoFrame(vid.elt);
            encoder.encode(frame, { keyFrame: false });
            frame.close();
          } catch (e) {}
        }
      }

      function updateRepeats() {
        if (audioReactive && fft) {
          const spectrum = fft.analyze();
          const peak = Math.max(...spectrum);
          if (peak > threshold && millis() - lastPeakTime > PEAK_COOLDOWN_MS) {
            datamoshRepeats = spectrum.indexOf(peak) >= 10 ? int(random(2, 6)) : 2;
            lastPeakTime = millis();
          }
        } else if (millis() - lastPeakTime > random(3000, 8000)) {
          datamoshRepeats = random() < 0.3 ? 2 : int(random(3, 10));
          lastPeakTime = millis();
        }
      }

      function drawText() {
        const now = millis();
        if (!textValue && now > nextTextAt) {
          textValue = random(TEXTS);
          textUntil = now + random(1200, 4000);
        }
        if (!textValue) return;
        fill("red");
        textSize(TEXT_SIZE);
        text(textValue, width / 2, height / 2);
        if (now >= textUntil) {
          textValue = "";
          nextTextAt = now + random(6000, 16000);
        }
      }

      async function checkCodecSupport() {
        const { supported } = await navigator.mediaCapabilities.decodingInfo({
          type: "file",
          video: {
            contentType: 'video/webm; codecs="vp8"',
            width: windowWidth,
            height: windowHeight,
            bitrate: 500000,
            framerate: 30,
          },
        });
        return supported;
      }

      function setupWebCodecs() {
        if (encoder && encoder.state !== "closed") encoder.close();
        if (decoder && decoder.state !== "closed") decoder.close();

        videoCanvas = document.createElement("canvas");
        videoCanvas.width = windowWidth;
        videoCanvas.height = windowHeight;
        videoCtx = videoCanvas.getContext("2d");

        encoder = new VideoEncoder({ output: onEncodedChunk, error: () => {} });
        encoder.configure({ codec: "vp8", width: windowWidth, height: windowHeight });
        decoder = new VideoDecoder({ output: onDecodedFrame, error: () => {} });
        decoder.configure({ codec: "vp8" });
      }

      function onEncodedChunk(chunk) {
        if (decoder.state !== "configured") return;
        for (let i = 0; i < datamoshRepeats; i++) decoder.decode(chunk);
      }

      function onDecodedFrame(frame) {
        videoCtx.setTransform(-1, 0, 0, 1, videoCanvas.width, 0);
        videoCtx.drawImage(frame, 0, 0, videoCanvas.width, videoCanvas.height);
        frame.close();
      }

      async function enableAudioReactive() {
        await userStartAudio();
        mic = new p5.AudioIn();
        await mic.start();
        fft = new p5.FFT(0.6, 256);
        fft.setInput(mic);
      }

      function disableAudioReactive() {
        if (mic && mic.enabled) mic.stop();
        mic = fft = null;
      }

      function bindAudioToggle() {
        const toggle = document.getElementById("audio-toggle");
        const label = document.getElementById("audio-label");
        const render = () =>
          (label.textContent = `Audio reactive: ${audioReactive ? "on" : "off"}`);
        toggle.checked = audioReactive;
        render();
        toggle.addEventListener("change", async () => {
          audioReactive = toggle.checked;
          render();
          if (audioReactive) await enableAudioReactive();
          else disableAudioReactive();
        });
      }

      function mousePressed(e) {
        if (!VideoSource.clickedCanvas(e)) return;
        videos.next();
        if (audioReactive && !fft) enableAudioReactive();
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        if (vid) vid.size(windowWidth, windowHeight);
        if (videoCanvas) {
          videoCanvas.width = windowWidth;
          videoCanvas.height = windowHeight;
        }
      }
    </script>
  </head>

  <body>
    <header>
      <label id="audio-label" for="audio-toggle"></label>
      <input type="checkbox" id="audio-toggle" />
      <label for="threshold-slider"
        >Threshold: <span id="threshold-value"></span
      ></label>
      <input type="range" id="threshold-slider" min="0" max="255" step="1" />
    </header>
  </body>
</html>
